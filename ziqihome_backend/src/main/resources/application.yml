spring:
  config:
    # 本地开发时优先读取仓库外的私有覆盖配置，避免把账号密码提交进 Git。
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ziqihome?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  # 本地默认使用 8081，避免和常见开发服务端口冲突。
  port: 8081
  forward-headers-strategy: framework
app:
  cors:
    # 同时放行 localhost 和 127.0.0.1，避免浏览器通过不同本地域名访问前端时触发登录 403。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
